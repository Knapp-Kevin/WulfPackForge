name: Test Wulfpack Forge

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q data subscripts ui tools main.py

      - name: Lint
        run: python -m pyflakes main.py data subscripts ui tools tests

      - name: Run tests with coverage
        run: python -m coverage run --source=data,subscripts,ui,main -m unittest discover -s tests -v

      - name: Enforce the coverage floor
        run: python -m coverage report --fail-under=85
