name: Cross-check Valheim Item Catalog

on:
  push:
    branches:
      - "feat/**"
    paths:
      - "tools/update_item_catalog.py"
      - "tools/catalogFromGame.py"
      - "data/valheim_items.json"
      - ".github/workflows/sync-item-catalog.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-check-catalog:
    if: github.ref_name != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate committed JSON
        run: python -m json.tool data/valheim_items.json > /dev/null

      - name: Cross-check the committed catalog against JotunnDoc
        run: python tools/update_item_catalog.py --cross-check-only data/valheim_items.json
